# The website, hickorysandsdistrictava.org (issue #96): site/ as it is, served by GitHub Pages. On a pull request that
# touches site/, the site's tests (tests/test_site.py: complete pages, every local file there, https links); on a push to
# main that touches site/, and by hand (Actions > site > Run workflow), the same tests and then site/ deployed to Pages.
# The custom domain, its DNS (at Squarespace) and HTTPS are set on the repository's Pages settings, not here; see
# BUILD.md. Runs on GitHub's Linux machines.
name: site
on:
  workflow_dispatch:
  pull_request:
    paths:
      - site/**
      - tests/test_site.py
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - tests/test_site.py
      - .github/workflows/site.yml
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false   # never stop a deployment half way
jobs:
  test:
    name: the site's tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: The test tools, audited first, then installed from the hash-pinned lock
        run: |
          python -I -B src/setup/packages.py audit requirements-dev.txt
          python -m venv .venv
          .venv/bin/python -m pip install -q --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Every page complete, every local file there, every link off the site https
        run: .venv/bin/python -E -s -B -m pytest -q tests/test_site.py
  deploy:
    name: site/ to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
