# Pre-commit hooks (https://pre-commit.com). Every hook runs a tool installed in the project's .venv from
# requirements-dev.txt (./build.sh env), so nothing is downloaded or installed globally at commit time.
# Run on everything: ./build.sh lint
default_install_hook_types: [pre-commit]
exclude: ^(tobedeleted|target|dist|\.venv)/

repos:
  - repo: local
    hooks:
      # --- files and repository (pre-commit-hooks) -----------------------------------------------------------
      - id: check-added-large-files
        name: no large files (> 2 MB; the quads are downloaded, not committed)
        entry: .venv/bin/check-added-large-files --maxkb=2048
        language: system
      - id: check-case-conflict
        name: no file names that differ only in case
        entry: .venv/bin/check-case-conflict
        language: system
      - id: check-illegal-windows-names
        name: no file names Windows cannot hold
        entry: Illegal Windows file names
        language: fail
        files: '(?i)((^|/)(CON|PRN|AUX|NUL|COM[\d¹²³]|LPT[\d¹²³])(\.|/|$)|[<>:\"\\|?*\x00-\x1F]|/[^/]*[\.\s]/|[^/]*[\.\s]$)'
      - id: check-merge-conflict
        name: no merge conflict markers
        entry: .venv/bin/check-merge-conflict
        language: system
        types: [text]
      - id: check-symlinks
        name: no broken symlinks
        entry: .venv/bin/check-symlinks
        language: system
        types: [symlink]
      - id: destroyed-symlinks
        name: no symlinks replaced by files
        entry: .venv/bin/destroyed-symlinks
        language: system
      - id: forbid-new-submodules
        name: no git submodules
        entry: .venv/bin/forbid-new-submodules
        language: system
        types: [directory]
      - id: check-executables-have-shebangs
        name: executables have a shebang
        entry: .venv/bin/check-executables-have-shebangs
        language: system
        types: [text, executable]
      - id: check-shebang-scripts-are-executable
        name: scripts with a shebang are executable
        entry: .venv/bin/check-shebang-scripts-are-executable
        language: system
        types: [text]
      - id: fix-byte-order-marker
        name: no UTF-8 byte order marks
        entry: .venv/bin/fix-byte-order-marker
        language: system
        types: [text]
      - id: mixed-line-ending
        name: LF line endings
        entry: .venv/bin/mixed-line-ending --fix=lf
        language: system
        types: [text]
      - id: trailing-whitespace
        name: no trailing whitespace
        entry: .venv/bin/trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
        exclude: ^resources/ttb/federal-register-.*\.xml$   # the Federal Register's file, kept byte for byte
      - id: end-of-file-fixer
        name: files end with one newline
        entry: .venv/bin/end-of-file-fixer
        language: system
        types: [text]
        exclude: ^resources/ttb/federal-register-.*\.xml$   # the Federal Register's file, kept byte for byte
      - id: check-json
        name: JSON and GeoJSON parse
        entry: .venv/bin/check-json
        language: system
        types: [json]
      - id: check-yaml
        name: YAML parses
        entry: .venv/bin/check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: TOML parses
        entry: .venv/bin/check-toml
        language: system
        types: [toml]
      - id: check-vcs-permalinks
        name: links to code use permanent commit links
        entry: .venv/bin/check-vcs-permalinks
        language: system
        types: [text]

      # --- secrets and private material --------------------------------------------------------------------------
      - id: detect-private-key
        name: no private keys
        entry: .venv/bin/detect-private-key
        language: system
        types: [text]
      - id: detect-secrets
        name: no passwords, tokens or API keys (detect-secrets; known findings in .secrets.baseline)
        entry: .venv/bin/detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: ^\.secrets\.baseline$
      - id: private-words
        name: no names or words listed in .private-words (gitignored)
        entry: .venv/bin/python -E -s -B src/checks/check_private_words.py
        language: system
        types: [text]
        exclude: ^resources/ttb/federal-register-.*\.xml$   # TTB's published notice, verbatim: it names TTB's contact (allowed)

      - id: step-text
        name: step text uses the Federal Register's characters; TTB's steps identical to the Federal Register
        entry: .venv/bin/python -E -s -B src/checks/check_step_text.py
        language: system
        files: ^(resources/boundary/description/.*\.json|resources/ttb/federal-register-.*\.xml|src/boundary/build_agreed\.py|src/checks/check_step_text\.py)$
        pass_filenames: false

      - id: audit-packages
        name: no Python package with a known vulnerability (OSV; when the lock files change)
        entry: .venv/bin/python -I -B src/setup/packages.py audit requirements.txt requirements-dev.txt
        language: system
        files: ^requirements(-dev)?\.(txt|in)$
        pass_filenames: false

      # --- Python -------------------------------------------------------------------------------------------------
      - id: check-ast
        name: Python parses
        entry: .venv/bin/check-ast
        language: system
        types: [python]
      - id: check-builtin-literals
        name: Python uses literals, not dict()/list() calls
        entry: .venv/bin/check-builtin-literals --ignore=dict
        language: system
        types: [python]
      - id: debug-statements
        name: no breakpoints or debugger imports
        entry: .venv/bin/debug-statement-hook
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (Python layout, Google style, 80 columns; ruff.toml)
        entry: .venv/bin/ruff format --force-exclude   # rewrites the files it would change: add them and commit again
        language: system
        types: [python]
      - id: ruff
        name: ruff check (Python lint, Google style and stricter checks; ruff.toml)
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types: [python]

      # --- shell and spelling -------------------------------------------------------------------------------------
      - id: shellcheck
        name: shellcheck (shell scripts)
        entry: .venv/bin/shellcheck --severity=warning
        language: system
        types: [shell]
      - id: codespell
        name: codespell (misspellings, .codespellrc)
        entry: .venv/bin/codespell
        language: system
        types: [text]
