# The unit tests in tests/ (pytest, from requirements-dev.txt): ./build.sh test runs them all; the lint workflow runs
# those that need no more than the lint tools (-m "not build"). The scripts under src/ are imported as src.<dir>.<name>.
[pytest]
testpaths = tests
pythonpath = .
cache_dir = target/pytest-cache
addopts = -ra
markers =
    build: needs the build's own tools (GDAL, NumPy/SciPy, poppler's pdftotext), as ./build.sh env installs them
