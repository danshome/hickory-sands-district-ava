# The unit tests in tests/ (pytest, from requirements-dev.txt): ./build.sh test runs them all but the live ones; the lint
# workflow runs those that need no more than the lint tools (-m "not build and not live"). The browser tests of the
# published dashboard (tests/live, marked live) run only when asked: ./build.sh check-live, or pytest -m live tests/live
# (a -m on the command line replaces the one below). The scripts under src/ are imported as src.<dir>.<name>.
[pytest]
testpaths = tests
pythonpath = .
cache_dir = target/pytest-cache
addopts = -ra -m "not live"
markers =
    build: needs the build's own tools (GDAL, NumPy/SciPy, poppler's pdftotext), as ./build.sh env installs them
    live: browses the published dashboard in Google Chrome (Playwright; network): ./build.sh check-live, or -m live
